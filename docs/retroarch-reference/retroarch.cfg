# Seed configuration for RetroArch on the RG40XXV.
#
# This file overwrites the stock one RetroArch's own `make install` drops here
# (Makefile:268; qb/config.libs.sh:24-27 maps --prefix=/usr to
# GLOBAL_CONFIG_DIR=/etc). Buildroot applies rootfs overlays in target-finalize,
# after packages install, so this version is the one that ends up in the image.
#
# TRAP: this file is a seed, not the live configuration. On first run
# RetroArch copies it to $HOME/.config/retroarch/retroarch.cfg -- $HOME is
# /root, which is the writable f2fs partition -- and from then on the copy
# wins and edits here have no effect. To test a change to this file you must
# delete /root/.config/retroarch/retroarch.cfg first, or launch with
# `retroarch --config /etc/retroarch.cfg`.

# GLES2 through RetroArch's own KMS/DRM+EGL context. "gl" is the GLES2
# driver when the build has HAVE_OPENGLES; it is not desktop GL.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
# 640x480 panel, cores mostly at 240p-320p: nearest neighbour, not bilinear.
video_smooth = "false"

audio_driver = "alsa"
audio_device = "default"

# RGUI is the only menu compiled in. Ozone/XMB/MaterialUI need media/assets,
# which is a git submodule and is absent from the release tarball.
menu_driver = "rgui"
menu_show_online_updater = "false"
menu_show_core_updater = "false"

# See nerves_defconfig for why input is SDL2 and not udev or linuxraw.
input_driver = "sdl2"
input_joypad_driver = "sdl2"

libretro_directory = "/usr/lib/libretro"

# The rootfs is a read-only squashfs; everything RetroArch writes has to land
# on the application partition mounted at /root.
savefile_directory = "/root/retroarch/saves"
savestate_directory = "/root/retroarch/states"
system_directory = "/root/retroarch/system"
screenshot_directory = "/root/retroarch/screenshots"
